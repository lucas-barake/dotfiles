# Editor UI
"ui.background" = { bg = "bg" }
"ui.text" = { fg = "fg" }
"ui.text.focus" = { fg = "text" }
"ui.text.inactive" = { fg = "fg_muted" }
"ui.text.info" = { fg = "fg" }
"ui.text.directory" = { fg = "blue_bright" }

"ui.cursor.primary" = { fg = "bg", bg = "blue_cursor" }
"ui.cursor.match" = { bg = "match_paren" }
"ui.cursorline.primary" = { bg = "bg_highlight" }
"ui.cursorcolumn.primary" = { bg = "bg_highlight" }

"ui.selection" = { bg = "visual" }
"ui.selection.primary" = { bg = "visual" }

"ui.linenr" = { fg = "linenr" }
"ui.linenr.selected" = { fg = "purple" }

"ui.gutter" = { bg = "bg" }
"ui.gutter.selected" = { bg = "bg_highlight" }

"ui.statusline" = { fg = "text_light", bg = "bg_dark" }
"ui.statusline.inactive" = { fg = "fg_muted", bg = "bg_dark" }
"ui.statusline.normal" = { fg = "bg_dark", bg = "purple_accent", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "bg_dark", bg = "green_bright", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "bg_dark", bg = "yellow", modifiers = ["bold"] }
"ui.statusline.separator" = { fg = "border" }

"ui.popup" = { fg = "text", bg = "bg_float" }
"ui.popup.info" = { fg = "text", bg = "bg_float" }
"ui.window" = { fg = "border" }

"ui.menu" = { fg = "text", bg = "bg_float" }
"ui.menu.selected" = { bg = "menu_sel" }
"ui.menu.scroll" = { fg = "fg_gutter" }

"ui.help" = { fg = "text", bg = "bg_float" }
"ui.virtual.whitespace" = { fg = "fg_gutter" }
"ui.virtual.indent-guide" = { fg = "gray_dark" }
"ui.virtual.ruler" = { bg = "bg_highlight" }
"ui.virtual.wrap" = { fg = "fg_gutter" }
"ui.virtual.inlay-hint" = { fg = "inlay_hint_fg", bg = "inlay_hint_bg" }
"ui.virtual.inlay-hint.parameter" = { fg = "inlay_hint_fg", bg = "inlay_hint_bg" }
"ui.virtual.inlay-hint.type" = { fg = "inlay_hint_fg", bg = "inlay_hint_bg" }
"ui.virtual.jump-label" = { fg = "bg", bg = "purple_accent", modifiers = ["bold"] }

"ui.bufferline" = { fg = "fg_muted", bg = "bg_dark" }
"ui.bufferline.active" = { fg = "text", bg = "tab_active" }
"ui.bufferline.background" = { bg = "bg_dark" }

"ui.picker.header.column" = { fg = "fg_muted" }
"ui.picker.header.column.active" = { fg = "purple" }

"ui.highlight" = { bg = "search" }
"ui.highlight.frameline" = { bg = "bg_highlight" }
"ui.debug.breakpoint" = { fg = "red_error" }
"ui.debug.active" = { bg = "bg_highlight" }

# Diagnostics
"diagnostic.error" = { underline = { color = "red_error", style = "curl" } }
"diagnostic.warning" = { underline = { color = "warn", style = "curl" } }
"diagnostic.info" = { underline = { color = "purple", style = "curl" } }
"diagnostic.hint" = { underline = { color = "cyan", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

"error" = { fg = "red_error" }
"warning" = { fg = "warn" }
"info" = { fg = "purple" }
"hint" = { fg = "cyan" }

# Diff
"diff.plus" = { fg = "git_add" }
"diff.minus" = { fg = "git_delete" }
"diff.delta" = { fg = "purple" }
"diff.plus.gutter" = { bg = "diff_add" }
"diff.minus.gutter" = { bg = "diff_delete" }
"diff.delta.gutter" = { bg = "diff_change" }

# Syntax: Comments
"comment" = { fg = "green_comment", modifiers = ["italic"] }
"comment.line" = { fg = "green_comment", modifiers = ["italic"] }
"comment.block" = { fg = "green_comment", modifiers = ["italic"] }
"comment.block.documentation" = { fg = "green_comment", modifiers = ["italic"] }

# Syntax: Variables (Nvim: @variable=white, @variable.builtin=red italic, @variable.parameter=cyan, @variable.member/@property=blue)
"variable" = { fg = "white" }
"variable.builtin" = { fg = "red", modifiers = ["italic"] }
"variable.parameter" = { fg = "cyan" }
"variable.other" = { fg = "white" }
"variable.other.member" = { fg = "blue" }
"variable.other.member.private" = { fg = "blue" }

# Syntax: Constants (Nvim: @constant=yellow, @constant.builtin=yellow, @number=yellow, @boolean=yellow, @character=green)
"constant" = { fg = "yellow" }
"constant.builtin" = { fg = "yellow" }
"constant.builtin.boolean" = { fg = "yellow" }
"constant.character" = { fg = "green" }
"constant.character.escape" = { fg = "cyan_light" }
"constant.numeric" = { fg = "yellow" }
"constant.numeric.integer" = { fg = "yellow" }
"constant.numeric.float" = { fg = "yellow" }

# Syntax: Strings (Nvim: @string=green, @string.escape=cyan_light, @string.regexp=cyan_light)
"string" = { fg = "green" }
"string.regexp" = { fg = "cyan_light" }
"string.special" = { fg = "green", modifiers = ["underlined"] }
"string.special.url" = { fg = "green", modifiers = ["underlined"] }
"string.special.path" = { fg = "green" }
"string.special.symbol" = { fg = "green" }

# Syntax: Functions (Nvim: @function/@function.builtin/@function.call/@function.method=orange, @constructor=orange)
"function" = { fg = "orange" }
"function.builtin" = { fg = "orange" }
"function.method" = { fg = "orange" }
"function.method.private" = { fg = "orange" }
"function.macro" = { fg = "purple" }
"function.special" = { fg = "orange" }
"constructor" = { fg = "silver" }

# Syntax: Types (Nvim: @type=yellow, @type.builtin=yellow, @lsp.type.typeParameter=pink_type)
"type" = { fg = "yellow" }
"type.builtin" = { fg = "yellow" }
"type.parameter" = { fg = "pink_type" }
"type.enum" = { fg = "yellow" }
"type.enum.variant" = { fg = "yellow" }

# Syntax: Keywords (Nvim: all @keyword variants=purple)
"keyword" = { fg = "purple" }
"keyword.control" = { fg = "purple" }
"keyword.control.conditional" = { fg = "purple" }
"keyword.control.repeat" = { fg = "purple" }
"keyword.control.import" = { fg = "purple" }
"keyword.control.return" = { fg = "purple" }
"keyword.control.exception" = { fg = "purple" }
"keyword.function" = { fg = "purple" }
"keyword.operator" = { fg = "purple" }
"keyword.directive" = { fg = "purple" }
"keyword.storage" = { fg = "purple" }
"keyword.storage.type" = { fg = "purple" }
"keyword.storage.modifier" = { fg = "purple" }

# Syntax: Operators & Punctuation (Nvim: @operator=stone, @punctuation=stone, @punctuation.special=pink)
"operator" = { fg = "stone" }
"punctuation" = { fg = "stone" }
"punctuation.bracket" = { fg = "stone" }
"punctuation.delimiter" = { fg = "stone" }
"punctuation.special" = { fg = "pink" }

# Syntax: Other (Nvim: @module=silver, @tag=orange, @tag.builtin=red, @tag.attribute=yellow italic)
"namespace" = { fg = "silver" }
"label" = { fg = "purple" }
"attribute" = { fg = "yellow", modifiers = ["italic"] }
"tag" = { fg = "orange" }
"tag.builtin" = { fg = "red" }
"special" = { fg = "stone" }

# Markup
"markup.heading" = { fg = "green_light" }
"markup.heading.marker" = { fg = "green_light" }
"markup.heading.1" = { fg = "green_light", modifiers = ["bold"] }
"markup.heading.2" = { fg = "green_light", modifiers = ["bold"] }
"markup.heading.3" = { fg = "green_light" }
"markup.heading.4" = { fg = "green_light" }
"markup.heading.5" = { fg = "green_light" }
"markup.heading.6" = { fg = "green_light" }
"markup.italic" = { fg = "red", modifiers = ["italic"] }
"markup.bold" = { fg = "red", modifiers = ["bold"] }
"markup.underline" = { fg = "orange_dark", modifiers = ["underlined"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link" = { fg = "blue_bright" }
"markup.link.url" = { fg = "green", modifiers = ["underlined"] }
"markup.link.text" = { fg = "blue_bright" }
"markup.raw" = { fg = "purple_light" }
"markup.raw.inline" = { fg = "purple_light" }
"markup.raw.block" = { fg = "purple_light" }
"markup.list" = { fg = "white" }
"markup.list.unnumbered" = { fg = "white" }
"markup.list.numbered" = { fg = "white" }
"markup.quote" = { fg = "fg_muted", modifiers = ["italic"] }

